AWSTemplateFormatVersion: "2010-09-09"
Description: Spry agenda parser - browser -> Lambda URL (outside the VPC) -> Bedrock Claude

# Lives next to the ECR image (the region of the other stacks). Bedrock is called in BedrockRegion.
Parameters:
  ProjectName:
    Type: String
    Default: spry
  ImageUri:
    Type: String
    Description: The backend image in ECR, tagged with a commit SHA
  ParserModel:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
  BedrockRegion:
    Type: String
    Default: us-east-1
  CognitoAuthority:
    Type: String
    Description: Output Authority of the spry-auth stack
  CognitoClientId:
    Type: String
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: https://app.spry-koval.me,http://localhost:5173
  BudgetEmail:
    Type: String
    Default: ""
    Description: Gets a mail at 80% (forecast) and 100% of the monthly budget; empty = no budget

Conditions:
  HasBudget: !Not [!Equals [!Ref BudgetEmail, ""]]

Resources:
  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: call-bedrock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource: "*" # narrowing it is a discussion question

  # No VpcConfig: it needs no database, so it costs $0 when idle and reaches Bedrock over the internet.
  Parser:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-agenda-parser
      PackageType: Image
      Code: { ImageUri: !Ref ImageUri }
      ImageConfig:
        EntryPoint: [python, -m, awslambdaric]
        Command: [app.ai.agenda_lambda.handler]
      Role: !GetAtt ParserRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          BEDROCK_REGION: !Ref BedrockRegion
          COGNITO_AUTHORITY: !Ref CognitoAuthority
          COGNITO_CLIENT_ID: !Ref CognitoClientId

  # Public URL, but the handler rejects any request without a valid Cognito ID token (401).
  ParserUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Parser.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 600

  UrlInvokeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Parser
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Parser
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasBudget
    Properties:
      Budget:
        BudgetName: !Sub ${ProjectName}-monthly-5usd
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 5, Unit: USD }
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  ParserUrl:
    Value: !GetAtt ParserUrl.FunctionUrl
